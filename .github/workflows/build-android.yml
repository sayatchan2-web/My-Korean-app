name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore signing.keystore \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Korean App Admin, OU=Engineering, O=Korean App, L=City, ST=State, C=US"

      - name: Create Bubblewrap project
        run: |
          mkdir twa-build && cd twa-build
          echo "n" | bubblewrap init \
            --manifest="https://sayatchan2-web.github.io/My-Korean-app/manifest.json" \
            --directory=. \
            --host="sayatchan2-web.github.io" \
            --name="تعلم الكورية واستعد للتوبيك" \
            --packageId="com.korean.learn" \
            --startUrl="/My-Korean-app/" \
            --iconUrl="https://sayatchan2-web.github.io/My-Korean-app/icon-512.png" \
            --maskableIconUrl="https://sayatchan2-web.github.io/My-Korean-app/icon-512-maskable.png" \
            --themeColor="#1a1a2e" \
            --backgroundColor="#fce4ec" \
            --enableNotifications=false \
            --signingKeyPath="../signing.keystore" \
            --signingKeyAlias="my-key-alias"

      - name: Build AAB
        working-directory: twa-build
        run: |
          echo "n" | bubblewrap build \
            --signingKeyPath="../signing.keystore" \
            --signingKeyAlias="my-key-alias" \
            --keystorePassword="${{ secrets.KEY_STORE_PASSWORD }}" \
            --keyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: korean-app-release
          path: |
            twa-build/app-release-bundle.aab
            twa-build/app-release.apk
          retention-days: 7
