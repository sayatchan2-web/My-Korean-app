name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths (skip interactive setup)
        run: |
          mkdir -p ~/.bubblewrap
          echo '{
            "jdkPath": "'"$JAVA_HOME"'",
            "androidSdkPath": "'"$ANDROID_SDK_ROOT"'"
          }' > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore signing.keystore \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Korean App Admin, OU=Engineering, O=Korean App, L=City, ST=State, C=US" \
            -noprompt

      - name: Init Bubblewrap project
        run: |
          mkdir -p twa-build
          cd twa-build
          bubblewrap init \
            --manifest="https://sayatchan2-web.github.io/My-Korean-app/manifest.json" \
            --directory=.

      - name: Build AAB
        run: |
          cd twa-build
          bubblewrap build \
            --signingKeyPath="../signing.keystore" \
            --signingKeyAlias="my-key-alias" \
            --keystorePassword="${{ secrets.KEY_STORE_PASSWORD }}" \
            --keyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: korean-app-release
          path: |
            twa-build/app-release-bundle.aab
            twa-build/app-release.apk
          retention-days: 7
