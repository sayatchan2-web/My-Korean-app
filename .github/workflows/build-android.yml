name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # هنا قمنا بتعديل المسار والأمر ليدخل مباشرة لمجلد الأندرويد الداخلي دون الحاجة للملف المفقود
      - name: Build APK directly
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          elif [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            cd android && ./gradlew assembleRelease || gradle assembleRelease
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korean-App-APK
          path: |
            **/build/outputs/apk/release/*.apk
